
name: Matrix and Artifact Practice

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Create Report
        run: |
          mkdir -p reports
          echo "Node version: ${{ matrix.node-version }}" > reports/report-${{ matrix.node-version }}.txt
          echo "Commit: ${{ github.sha }}" >> reports/report-${{ matrix.node-version }}.txt

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: report-node-${{ matrix.node-version }}
          path: reports/

  summarize:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Download Reports
        uses: actions/download-artifact@v4
        with:
          pattern: report-node-*
          path: downloaded-reports
          merge-multiple: true

      - name: Print Reports
        run: |
          echo "All Node.js reports:"
          find downloaded-reports -type f
          cat downloaded-reports/*.txt
